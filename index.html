<script>
let balance = 5;
let taskRunning = false;

function completeTask() {
  if (taskRunning) return;
  taskRunning = true;

  alert("🔔 Ad দেখার পর ১০ সেকেন্ড অপেক্ষা করো");

  // এখানে আপাতত fake ad
  window.open("https://www.google.com", "_blank");

  let seconds = 10;

  let timer = setInterval(() => {
    seconds--;

    if (seconds <= 0) {
      clearInterval(timer);
      balance += 5;
      document.getElementById("balance").innerText = balance;
      alert("✅ ৳5 যোগ হয়েছে");
      taskRunning = false;
    }
  }, 1000);
}
</script>
